<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Aqua Engineer Math</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@600;700;800&display=swap">
<style>
/* Konsep tata letak: sidebar bulat di kiri (ikon bawah di ponsel), area kerja bergaya gim kartun dengan garis tebal navy */
:root{
  --aqua:#20B8F2; --ocean:#0875D1; --turq:#40D9D0; --sky:#8DE2FF; --sun:#FFD84D;
  --coral:#FF8BA7; --mint:#8CE6B2; --lav:#BFA8FF; --cream:#FFF8E8; --white:#FFFFFF; --navy:#15365B;
  --pink:#FF9BD2; --orange:#FF8A1F; --orange-d:#D96A00;
  --ok:#1FA971; --ok-bg:#D8F7E7; --warn:#B27A00; --warn-bg:#FFF1BF; --bad:#D6304F; --bad-bg:#FFE0E6;
  --muted:#4A6688; --line:#15365B; --shadow:0 5px 0 rgba(21,54,91,.16);
  --f-head:'Baloo 2','Nunito',system-ui,sans-serif; --f-body:'Nunito',system-ui,-apple-system,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html{font-size:16px}
@media(min-width:1600px){html{font-size:18px}}
@media(min-width:2200px){html{font-size:21px}}
body{background:var(--cream);color:var(--navy);font-family:var(--f-body);font-size:1rem;line-height:1.5;margin:0;
  background-image:radial-gradient(rgba(32,184,242,.13) 2px,transparent 2px);background-size:26px 26px}
h1,h2,h3,h4{font-family:var(--f-head);line-height:1.15;margin:0;text-wrap:balance}
h1{font-size:clamp(1.8rem,4.5vw,3rem)} h2{font-size:clamp(1.4rem,3vw,2rem)} h3{font-size:1.25rem} h4{font-size:1.05rem}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:4px solid var(--ocean);outline-offset:2px;border-radius:10px}
svg{max-width:100%}
.shell{display:grid;grid-template-columns:260px minmax(0,1fr);gap:20px;max-width:1900px;margin:0 auto;
  padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.side{position:sticky;top:16px;align-self:start;background:linear-gradient(180deg,var(--aqua),var(--ocean));border:3px solid var(--line);border-radius:28px;padding:16px 12px;box-shadow:var(--shadow);color:#fff;display:flex;flex-direction:column;gap:6px;max-height:calc(100dvh - 32px);overflow:auto}
.brand{display:flex;align-items:center;gap:8px;padding:4px 6px 12px;font-family:var(--f-head);font-weight:800;font-size:1.15rem;line-height:1;color:#fff}
.brand small{display:block;font-size:.7rem;font-weight:700;opacity:.9;margin-top:3px}
.nav{display:flex;align-items:center;gap:12px;width:100%;min-height:52px;padding:8px 14px;border:3px solid transparent;border-radius:20px;background:transparent;color:#fff;font-weight:800;text-align:left;font-size:1rem}
.nav:hover{background:rgba(255,255,255,.18)}
.nav[aria-current=page]{background:var(--sun);color:var(--navy);border-color:var(--line);box-shadow:0 4px 0 rgba(21,54,91,.25)}
.nav .ic{flex:none}
.side-foot{margin-top:auto;padding-top:10px}
.pill-save{font-size:.78rem;font-weight:700;background:rgba(255,255,255,.2);border-radius:14px;padding:8px 10px;color:#fff}
.main{min-width:0;display:flex;flex-direction:column;gap:20px}
.topbar{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;border:2.5px solid var(--line);border-radius:999px;padding:4px 12px;font-weight:800;font-size:.85rem;background:#fff}
.card{background:#fff;border:3px solid var(--line);border-radius:26px;box-shadow:var(--shadow);padding:20px;min-width:0}
.card.soft{background:var(--cream)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:10px 22px;border:3px solid var(--line);border-radius:18px;background:#fff;font-family:var(--f-head);font-weight:800;font-size:1.05rem;box-shadow:0 5px 0 rgba(21,54,91,.28);transition:transform .08s}
.btn:hover{transform:translateY(-2px)} .btn:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(21,54,91,.28)}
.btn.orange{background:var(--orange);color:#fff;font-size:1.3rem;padding:12px 30px;text-shadow:0 2px 0 rgba(0,0,0,.18)}
.btn.blue{background:var(--aqua);color:#fff} .btn.yellow{background:var(--sun)} .btn.mint{background:var(--mint)} .btn.coral{background:var(--coral)}
.btn.sm{min-height:42px;padding:6px 14px;font-size:.95rem} .btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center} .grow{flex:1;min-width:0}
.hero{position:relative;overflow:hidden;background:linear-gradient(135deg,var(--sky),#E8FAFF 55%,#fff);display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:12px;align-items:center;padding:clamp(16px,3vw,32px)}
.hero h1{color:var(--ocean);text-shadow:0 3px 0 #fff}
.slogan{font-family:var(--f-head);font-weight:800;color:var(--navy);font-size:clamp(1rem,2vw,1.3rem)}
.greet{font-family:var(--f-head);font-weight:800;font-size:clamp(1.4rem,3vw,2rem)}
.hero-art{min-width:0}
.journey{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:12px}
.jcard{display:flex;flex-direction:column;gap:8px;border:3px solid var(--line);border-radius:24px;padding:14px;background:var(--c);box-shadow:var(--shadow);min-width:0;position:relative}
.jcard .num{position:absolute;top:-12px;left:-6px;width:36px;height:36px;border-radius:50%;background:#fff;border:3px solid var(--line);display:grid;place-items:center;font-family:var(--f-head);font-weight:800}
.jcard h4{font-size:1rem;margin-top:4px} .jcard .sub{font-weight:800;font-size:.85rem}
.jcard p{font-size:.85rem;line-height:1.35;flex:1}
.status{display:inline-flex;align-items:center;gap:5px;font-weight:800;font-size:.78rem;border-radius:999px;padding:3px 10px;background:#fff;border:2px solid var(--line);width:max-content;max-width:100%}
.jcard.locked{filter:saturate(.45)} .jcard.current{outline:5px solid var(--orange);outline-offset:2px}
.art{background:rgba(255,255,255,.65);border-radius:18px;display:grid;place-items:center;padding:4px;height:84px}
.three{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.list li{display:flex;gap:10px;align-items:flex-start;font-weight:700}
.mat{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:3px solid var(--line);border-radius:18px;padding:10px 14px;background:var(--c);font-weight:800;min-height:56px;box-shadow:0 4px 0 rgba(21,54,91,.18)}
.mat:hover{transform:translateY(-2px)}
.progress{height:18px;border-radius:999px;background:#fff;border:3px solid var(--line);overflow:hidden}
.progress>i{display:block;height:100%;background:linear-gradient(90deg,var(--turq),var(--aqua));border-radius:999px;transition:width .4s}
.tip{display:flex;gap:12px;align-items:flex-end}
.bubble{position:relative;background:#fff;border:3px solid var(--line);border-radius:20px;padding:12px 16px;font-weight:700;flex:1;min-width:0}
.bubble:before{content:"";position:absolute;left:-12px;bottom:18px;width:18px;height:18px;background:#fff;border-left:3px solid var(--line);border-bottom:3px solid var(--line);transform:rotate(45deg)}
.bubble.ok{background:var(--ok-bg)} .bubble.ok:before{background:var(--ok-bg)}
.bubble.bad{background:var(--bad-bg)} .bubble.bad:before{background:var(--bad-bg)}
.stepper{display:flex;gap:8px;overflow-x:auto;padding:6px 4px 10px}
.step{flex:none;display:flex;align-items:center;gap:8px;border:3px solid var(--line);border-radius:999px;padding:6px 14px 6px 6px;background:#fff;font-weight:800;min-height:48px}
.step b{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--c);border:2.5px solid var(--line);font-family:var(--f-head)}
.step[aria-current=step]{background:var(--sun)} .step:disabled{opacity:.5}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.field label{font-weight:800}
.in{width:100%;min-height:48px;border:3px solid var(--line);border-radius:16px;padding:8px 14px;background:#fff}
textarea.in{min-height:96px;resize:vertical}
.hint{font-size:.88rem;color:var(--muted);font-weight:700}
.table-wrap{overflow-x:auto;border:3px solid var(--line);border-radius:18px;background:#fff}
table{border-collapse:collapse;width:100%;min-width:560px;font-variant-numeric:tabular-nums}
th,td{padding:10px 12px;text-align:left;border-bottom:2px solid #D7E6F5}
th{background:var(--sky);font-family:var(--f-head);font-size:.95rem} tfoot td{font-weight:800;background:var(--cream)}
td.num,th.num{text-align:right}
.num-in{width:110px;min-height:44px;border:3px solid var(--line);border-radius:14px;padding:4px 10px;text-align:right;font-weight:800;font-variant-numeric:tabular-nums}
.stat{display:inline-flex;align-items:center;gap:6px;font-weight:800;border-radius:999px;padding:3px 12px;border:2.5px solid var(--line);font-size:.85rem;white-space:nowrap}
.stat.ok{background:var(--ok-bg);color:#0B6B46} .stat.warn{background:var(--warn-bg);color:#6B4A00} .stat.bad{background:var(--bad-bg);color:#9A1B33} .stat.idle{background:#EEF3F9;color:var(--muted)}
.banner{display:flex;gap:12px;align-items:center;border:3px solid var(--line);border-radius:20px;padding:12px 16px;font-weight:800}
.banner.ok{background:var(--ok-bg)} .banner.warn{background:var(--warn-bg)} .banner.bad{background:var(--bad-bg)}
.calc{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;max-width:320px}
.calc button{min-height:54px;border:3px solid var(--line);border-radius:16px;background:#fff;font-family:var(--f-head);font-size:1.3rem;font-weight:800;box-shadow:0 4px 0 rgba(21,54,91,.2)}
.calc button.op{background:var(--sun)} .calc button.eq{background:var(--orange);color:#fff} .calc button.clr{background:var(--coral)}
.calc .scr{grid-column:1/-1;background:#E8FAFF;border:3px solid var(--line);border-radius:16px;padding:8px 14px;text-align:right;font-family:var(--f-head);font-size:1.7rem;min-height:56px;overflow:hidden}
.split{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(280px,1fr);gap:16px;align-items:start}
.canvas{border:3px solid var(--line);border-radius:22px;overflow:hidden;background:#BDEFFF;touch-action:none;user-select:none}
.canvas svg{display:block;width:100%;height:auto}
.flow{stroke-dasharray:10 10;animation:flow 1s linear infinite} @keyframes flow{to{stroke-dashoffset:-20}}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{min-height:44px;border:3px solid var(--line);border-radius:14px;background:#fff;font-weight:800;padding:6px 14px}
.seg button[aria-pressed=true]{background:var(--sun)}
.check{display:flex;gap:12px;align-items:center;border:3px solid var(--line);border-radius:18px;padding:10px 14px;background:#fff;font-weight:800;min-height:56px;cursor:pointer;width:100%;text-align:left}
.check[aria-checked=true]{background:var(--ok-bg)}
.box{flex:none;width:30px;height:30px;border:3px solid var(--line);border-radius:10px;display:grid;place-items:center;background:#fff}
.req li{font-weight:700} .req .yes{color:var(--ok)} .req .no{color:var(--muted)}
.pcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.modal-bg{position:fixed;inset:0;background:rgba(21,54,91,.55);z-index:50;display:grid;place-items:center;padding:16px}
.modal{background:var(--cream);border:3px solid var(--line);border-radius:28px;max-width:760px;width:100%;max-height:92dvh;overflow:auto;padding:22px;box-shadow:0 10px 0 rgba(21,54,91,.25)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom,0px));z-index:70;background:var(--navy);color:#fff;border-radius:18px;padding:12px 20px;font-weight:800;max-width:min(92vw,520px);box-shadow:0 6px 0 rgba(0,0,0,.2)}
.toast.err{background:var(--bad)}
.present{position:fixed;inset:0;z-index:60;background:linear-gradient(135deg,var(--sky),#fff);display:flex;flex-direction:column;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));gap:12px}
.present .slide{flex:1;min-height:0;overflow:auto;background:#fff;border:4px solid var(--line);border-radius:30px;padding:clamp(16px,3vw,40px);font-size:clamp(1.1rem,2.4vw,1.8rem)}
.present h2{font-size:clamp(1.6rem,4vw,3rem);color:var(--ocean);margin-bottom:12px}
.big-t{font-size:clamp(1.05rem,2.2vw,1.6rem)}
pre.code{background:var(--navy);color:#E8FAFF;border-radius:16px;padding:14px;overflow:auto;font-size:.8rem;max-height:340px;margin:0}
.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.kpi div{background:#fff;border:3px solid var(--line);border-radius:18px;padding:10px 14px}
.kpi b{display:block;font-family:var(--f-head);font-size:1.6rem;font-variant-numeric:tabular-nums}
.bottom{display:none}
.menu-toggle{display:none}
@media(max-width:1280px){.journey{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media(max-width:1000px){
  .shell{grid-template-columns:1fr;padding-bottom:96px}
  .side{display:none}
  .bottom{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:40;gap:4px;overflow-x:auto;background:linear-gradient(180deg,var(--aqua),var(--ocean));border-top:3px solid var(--line);padding:8px max(10px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px))}
  .bottom .nav{flex:none;flex-direction:column;gap:2px;width:78px;min-height:58px;padding:4px;font-size:.7rem;text-align:center;border-radius:16px;justify-content:center}
  .hero{grid-template-columns:1fr}
  .split{grid-template-columns:1fr}
  .three{grid-template-columns:1fr}
}
@media(max-width:700px){
  .journey{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:14px;padding:14px 6px 10px}
  .jcard{flex:none;width:232px;scroll-snap-align:start}
  .card{padding:14px;border-radius:22px}
  .btn.orange{font-size:1.15rem;padding:12px 22px}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.mart{border:3px solid var(--line);border-radius:20px;overflow:hidden;background:#fff}
.mcard{display:flex;flex-direction:column;gap:10px}
.mcard p{flex:1}
.lvl{font-weight:800}
.lvl-Mudah{background:var(--mint)} .lvl-Sedang{background:var(--sun)} .lvl-Menantang{background:var(--coral)}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:18px}

/* ===== Penyempurnaan responsif: HP · Desktop/Laptop · PID ===== */
html{-webkit-text-size-adjust:100%}
.btn,.nav,.seg button,.check,.step,.mat,.calc button{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.mgrid{grid-template-columns:repeat(auto-fill,minmax(min(290px,100%),1fr))}
.pcards{grid-template-columns:repeat(auto-fill,minmax(min(280px,100%),1fr))}
.table-wrap{-webkit-overflow-scrolling:touch}
.table-wrap th:first-child,.table-wrap td:first-child{position:sticky;left:0;z-index:1}
.table-wrap th:first-child{background:var(--sky)}
.table-wrap td:first-child{background:#fff}
.table-wrap tfoot td:first-child{background:var(--cream)}
.stepper{scroll-snap-type:x proximity;scrollbar-width:thin}
.step{scroll-snap-align:center}
@media(hover:none){.btn:hover,.mat:hover{transform:none}}

/* Tablet / HP landscape: menu bawah lebih rapi */
@media(min-width:701px) and (max-width:1000px){
  .bottom{justify-content:center}
  .bottom .nav{flex:1 1 0;width:auto;min-width:78px;max-width:112px;font-size:.8rem}
}
@media(max-width:1000px) and (max-height:500px){
  .shell{padding-bottom:72px}
  .bottom .nav{flex-direction:row;gap:6px;width:auto;min-height:48px;padding:4px 12px;font-size:.8rem}
}

/* HP portrait */
@media(max-width:700px){
  .shell{gap:12px;padding-block:10px}
  .main{gap:14px}
  .topbar>.row{width:100%}
  .topbar .btn{flex:1 1 150px}
  .bottom{scroll-snap-type:x proximity;scroll-padding-inline:10px}
  .bottom .nav{width:calc((100vw - 20px)/4.6);min-width:72px;min-height:62px;font-size:.72rem;scroll-snap-align:center}
  .btn{min-height:52px} .btn.sm{min-height:46px}
  .seg button{flex:1 1 140px}
  .calc{max-width:none}
  .kpi{grid-template-columns:repeat(2,minmax(0,1fr))}
  .modal-bg{align-items:end;padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px))}
  .modal{padding:16px;border-radius:24px;max-height:90dvh}
}

/* Desktop / laptop: area simulasi lebih lega dan tetap terlihat saat menggulir */
@media(min-width:1100px){
  .split{grid-template-columns:minmax(0,1.7fr) minmax(300px,1fr)}
  .split>:first-child:has(.canvas){position:sticky;top:16px;max-height:calc(100dvh - 32px);overflow:auto}
}

/* PID / layar sentuh besar: target sentuh besar, simulasi diprioritaskan */
@media (pointer:coarse) and (min-width:1000px),(min-width:1900px){
  .shell{grid-template-columns:clamp(260px,17rem,420px) minmax(0,1fr);gap:24px}
  .nav{min-height:64px;font-size:1.1rem}
  .btn{min-height:64px;font-size:1.2rem;padding:12px 28px;border-radius:20px}
  .btn.sm{min-height:58px;font-size:1.1rem}
  .btn.orange{font-size:1.55rem;padding:16px 38px}
  .seg button{min-height:60px;font-size:1.1rem;padding:8px 20px}
  .check{min-height:76px;font-size:1.1rem} .box{width:40px;height:40px}
  .step{min-height:64px} .step b{width:42px;height:42px}
  .in,.num-in{min-height:62px;font-size:1.15rem}
  .calc{max-width:440px;gap:12px} .calc button{min-height:76px;font-size:1.6rem}
  .mat{min-height:72px}
  .chip{font-size:1rem;padding:6px 16px}
  th,td{padding:14px 16px}
  .progress{height:24px}
  .split{grid-template-columns:minmax(0,2.2fr) minmax(320px,1fr);gap:24px}
}
@media(min-width:2200px){.shell{max-width:3400px}}
@media(min-width:3000px){html{font-size:28px}}

/* ===== Beranda ringkas & penanda menu aktif (HP) ===== */
.home .hero{align-content:center}
.bottom .nav{position:relative}
.bottom .nav[aria-current=page]{transform:translateY(-3px);box-shadow:0 4px 0 rgba(21,54,91,.3)}
@media(max-width:700px){
  .home .hero{padding:16px;gap:14px;min-height:calc(100dvh - 230px)}
  .home .greet{font-size:1.5rem;margin-top:10px!important}
  .home .big-t{font-size:1rem}
  .home .hero .btn.orange{width:100%}
}

/* ===== Perbaikan: toolbar bawah tidak boleh menutupi konten ===== */
/* Tinggi toolbar = --nav-h; ruang bawah konten mengikutinya + area aman + napas. Ditaruh paling akhir agar tidak tertimpa aturan lain. */
@media(max-width:1000px){
  :root{--nav-h:88px}
  .shell{padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 28px)!important}
  .toast{bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 12px)}
}
@media(max-width:700px){:root{--nav-h:86px}}
@media(max-width:1000px) and (max-height:500px){:root{--nav-h:72px}}

/* ===== Desktop / laptop (≥1100px): tidak ada perubahan untuk HP ===== */
@media(min-width:1100px){
  .home .hero{grid-template-columns:minmax(0,.85fr) minmax(0,1.3fr);min-height:calc(100dvh - 200px);padding:clamp(24px,3vw,56px);gap:24px}
  .home .greet{font-size:clamp(2rem,3vw,3.2rem)}
  .home .big-t{font-size:clamp(1.15rem,1.5vw,1.7rem)}
  .pcards,.mgrid{grid-template-columns:repeat(auto-fill,minmax(min(340px,100%),1fr))}
  .tip{max-width:1100px}
  .modal{max-width:min(980px,92vw)}
}
/* Tujuh kartu tahap: 4 kolom di laptop, 7 kolom hanya di layar sangat lebar */
@media(min-width:1281px) and (max-width:1699px){.journey{grid-template-columns:repeat(4,minmax(0,1fr))}}

/* Halaman tahap petualangan: area kerja di kiri, syarat & tombol selesai menempel di kanan */
@media(min-width:1400px){
  .main:has(>.stepper):has(>.card.soft:last-child){display:grid;grid-template-columns:minmax(0,1fr) clamp(320px,20vw,420px);gap:0 24px;align-items:start}
  .main:has(>.stepper):has(>.card.soft:last-child)>*{grid-column:1;margin-bottom:20px}
  .main:has(>.stepper):has(>.card.soft:last-child)>.stepper,
  .main:has(>.stepper):has(>.card.soft:last-child)>.card:first-child{grid-column:1/-1}
  .main:has(>.stepper):has(>.card.soft:last-child)>.card.soft:last-child{grid-column:2;grid-row:3/span 40;margin-bottom:0;position:sticky;top:16px;max-height:calc(100dvh - 32px);overflow:auto}
  .main:has(>.stepper):has(>.card.soft:last-child)>.card.soft:last-child .row{flex-direction:column;align-items:stretch}
  .main:has(>.stepper):has(>.card.soft:last-child)>.card.soft:last-child .btn{width:100%}
  .main:has(>.stepper):has(>.card.soft:last-child) .split{grid-template-columns:minmax(0,1fr)}
  .main:has(>.stepper):has(>.card.soft:last-child) .split>:first-child:has(.canvas){position:static;max-height:none;overflow:visible}
}
/* Layar sangat lebar / PID: simulasi dan hasil berdampingan, simulasi paling lebar */
@media(min-width:1800px){
  .main:has(>.stepper):has(>.card.soft:last-child) .split{grid-template-columns:minmax(0,1.7fr) minmax(320px,1fr)}
  .main:has(>.stepper):has(>.card.soft:last-child) .split>:first-child:has(.canvas){position:sticky;top:16px;max-height:calc(100dvh - 32px);overflow:auto}
}

/* ===== PID: jarak antar tombol lebih lega ===== */
@media (pointer:coarse) and (min-width:1000px),(min-width:1900px){
  .row{gap:16px} .seg{gap:10px} .list{gap:14px} .stepper{gap:12px}
  .modal{max-width:min(1200px,92vw);padding:28px}
  .bubble{font-size:1.15rem}
  .jcard .btn{width:100%}
}

/* ===== Dashboard Siswa ===== */
.dgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px;align-items:stretch}
.dpath{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.dstep{display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:6px;min-height:96px;padding:8px 4px;border:3px solid var(--line);border-radius:18px;background:var(--c);font-weight:800;font-size:.76rem;line-height:1.15;text-align:center;box-shadow:0 4px 0 rgba(21,54,91,.18)}
.dstep b{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:#fff;border:2.5px solid var(--line);font-family:var(--f-head)}
.dstep.done b{background:var(--ok-bg);color:var(--ok)}
.dstep.current{outline:5px solid var(--orange);outline-offset:2px}
.dstep.locked,.dstep.none{filter:saturate(.4);opacity:.75;cursor:not-allowed;box-shadow:none}
.dnow{outline:4px solid var(--orange);outline-offset:2px}
@media(max-width:1000px){.dgrid{grid-template-columns:1fr}}
@media(max-width:700px){.dpath{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media (pointer:coarse) and (min-width:1000px),(min-width:1900px){.dstep{min-height:124px;font-size:1rem;gap:8px;padding:12px 6px}.dstep b{width:44px;height:44px}}

/* ===== Dashboard Guru ===== */
.gcard{display:flex;flex-direction:column;gap:8px}
.gpres .slide{font-size:clamp(.95rem,1.35vw,1.5rem);display:flex;flex-direction:column;gap:14px}
.gpres table{font-size:inherit}
.gp-bar{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:10px}
.gp-head{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.gp-head h2{margin:0}
.gp-grid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:20px;align-items:start}
.gp-grid section,.gp-col{display:flex;flex-direction:column;gap:10px;min-width:0}
.gp-col{gap:20px}
.gp-grid h3{font-size:1.1em}
.gp-nav{margin-top:10px;justify-content:space-between}
@media(max-width:900px){.gp-grid{grid-template-columns:1fr}.gp-nav .btn{flex:1 1 140px}}
@media(max-width:700px){.gp-bar{gap:6px}}

/* Satu berkas logo resmi (assets/aqua-logo.webp, transparan) dipakai di seluruh aplikasi; LOGO_SRC dibuat oleh build.sh */
function Logo({width=300,style}){
  return html`<img src=${LOGO_SRC} alt="AQUA ENGINEER MATH" width="1000" height="675" decoding="async" style=${{display:'block',width:'100%',maxWidth:width,height:'auto',objectFit:'contain',...style}}/>`;
}

}

/* ---- Perhitungan alokasi ---- */
const getAlloc=(p,sc)=>p.alloc[sc]||p.alloc.normal;
function reachable(design,cut){
  const seen=new Set();if(!design.placed.tank)return seen;
  const adj={};
  design.edges.forEach(k=>{if(cut.includes(k))return;const [a,b]=k.split('|');if(!design.placed[a]||!design.placed[b])return;(adj[a]=adj[a]||[]).push(b);(adj[b]=adj[b]||[]).push(a)});
  const q=['tank'];seen.add('tank');
  while(q.length){const n=q.shift();(adj[n]||[]).forEach(m=>{if(!seen.has(m)){seen.add(m);q.push(m)}})}
  return seen;
}
function evaluate(p,sc,useRoute){
  const c=caseOf(p),S=scenOf(c)[sc],al=getAlloc(p,sc),reach=useRoute?reachable(p.design,S.cut):null,demand=demandOf(c),goalMin=demand>S.supply;let cum=0;
  const rows=c.fac.map(f=>{
    const a=Math.max(0,+al[f.id]||0);cum+=a;
    const placed=!!p.design.placed[f.id],conn=useRoute?reach.has(f.id):true,got=conn?a:0,min=pc(f.need,f.min),max=c.maxPct?Math.floor(f.need*c.maxPct/100):null,boros=max!==null&&a>max;
    return {...f,alloc:a,got,min,max,over:boros,placed,conn,remain:S.supply-cum,status:boros?'bad':got>=f.need?'ok':got>=min?'warn':'bad'};
  });
  const total=cum,overSupply=total>S.supply,left=S.supply-total;
  const overall=overSupply||rows.some(r=>r.status==='bad')?'bad':(!goalMin&&rows.some(r=>r.status==='warn'))?'warn':'ok';
  const names=fn=>rows.filter(fn).map(r=>r.nama).join(', ');
  const checks=[
    {ok:!overSupply,text:`Total alokasi ${fmt(total)} L tidak lebih dari persediaan ${fmt(S.supply)} L.`},
    {ok:left>=0,text:`Sisa air = ${fmt(S.supply)} − ${fmt(total)} = ${fmt(left)} L (tidak boleh negatif).`},
    {ok:rows.every(r=>r.got>=r.min),text:'Setiap fasilitas menerima air minimal sebesar batas minimumnya.'}];
  if(c.maxPct)checks.push({ok:rows.every(r=>!r.over),text:`Tidak ada alokasi yang melebihi ${c.maxPct}% kebutuhan.`});
  if(useRoute)checks.push({ok:rows.every(r=>r.conn),text:'Semua fasilitas terhubung ke tangki lewat pipa yang berfungsi.'});
  if(!goalMin)checks.push({ok:rows.every(r=>r.got>=r.need),text:'Setiap fasilitas menerima sebesar kebutuhannya.'});
  let text;
  if(overSupply)text=`Total alokasi ${fmt(total)} L melebihi persediaan ${fmt(S.supply)} L. Kurangi ${fmt(total-S.supply)} L.`;
  else if(rows.some(r=>r.over))text=`${names(r=>r.over)} melebihi batas ${c.maxPct}% kebutuhan. Kurangi agar tidak boros.`;
  else if(useRoute&&rows.some(r=>!r.conn&&r.alloc>0))text=`${names(r=>!r.conn&&r.alloc>0)} tidak terhubung ke tangki, jadi air tidak sampai.`;
  else if(overall==='bad')text=`${names(r=>r.status==='bad')} masih di bawah batas minimum.`;
  else if(overall==='warn')text=`${names(r=>r.status==='warn')} belum terpenuhi penuh, padahal air cukup untuk semua. Tambahkan alokasinya.`;
  else text=goalMin?`Semua fasilitas mencapai batas minimum dan total tidak melebihi persediaan. Kekurangan air ${fmt(demand-S.supply)} L dibagi dengan adil.`:'Semua kebutuhan terpenuhi dan total tidak melebihi persediaan.';
  return {S,rows,total,over:overSupply,left,overall,text,diff:S.supply-demand,demand,goalMin,checks};
}

function successLines(c){
  const d=demandOf(c),L=[`Total alokasi tidak lebih dari persediaan (${fmt(c.supply)} L).`];
  if(d<=c.supply)L.push('Setiap fasilitas menerima sebesar kebutuhannya.');
  else L.push(`Air tidak cukup untuk semua (kurang ${fmt(d-c.supply)} L). Setiap fasilitas minimal mencapai batas minimumnya.`);
  L.push('Batas minimum: '+c.fac.map(f=>`${f.nama} ${f.min}% = ${fmt(pc(f.need,f.min))} L`).join(', ')+'.');
  if(c.maxPct)L.push(`Tidak boleh boros: alokasi tiap fasilitas paling banyak ${c.maxPct}% dari kebutuhannya.`);
  L.push('Semua fasilitas tersambung ke tangki lewat pipa pada desain.');
  L.push('Sisa air = persediaan − total alokasi, dan tidak boleh negatif.');

    const r=await fetch(cfg.url.replace(/\/$/,'')+'/rest/v1/'+path,{method:'POST',headers:{apikey:cfg.key,Authorization:'Bearer '+t,'Content-Type':'application/json',...(extra||{})},body:JSON.stringify(body)});
    if(!r.ok)throw new Error(path+': '+r.status+' '+(await r.text()).slice(0,140));

  async sync(cfg,p){
    const up={Prefer:'resolution=merge-duplicates,return=minimal'};
    let gid=await SB.call(cfg,'rpc/join_group',{p_kelas:p.group.kelas,p_name:p.group.name,p_code_hash:p.group.codeHash,p_members:p.group.members});
    if(Array.isArray(gid))gid=gid[0];
    await SB.call(cfg,'aqua_projects',{id:p.id,group_id:gid,case_id:p.caseId,case_name:p.caseName,title:p.title,data:p,updated_at:p.updated},up);
    await SB.call(cfg,'project_progress',STAGES.map(s=>({project_id:p.id,stage:s.n,done:!!p.stageDone[s.n]})),up);
    const al=[];Object.keys(p.alloc).forEach(sc=>caseOf(p).fac.forEach(f=>al.push({project_id:p.id,scenario:sc,facility:f.id,need:f.need,allocated:+getAlloc(p,sc)[f.id]||0})));
    await SB.call(cfg,'water_allocations',al,up);
    if(p.improve.revisions.length)await SB.call(cfg,'project_revisions',p.improve.revisions.map(r=>({id:r.id,project_id:p.id,created_at:r.at,payload:r})),up);
    await SB.call(cfg,'project_presentations',{project_id:p.id,reflection:p.present.reflection,saved_at:p.present.savedAt},up);
  }
};
const SQL=`-- Skema Aqua Engineer Math (Supabase / Postgres)
create table groups(id uuid primary key default gen_random_uuid(), kelas text not null, name text not null,
  code_hash text not null, created_at timestamptz default now(), unique(kelas,name));
create table students(id uuid primary key default gen_random_uuid(), group_id uuid not null references groups on delete cascade, full_name text not null);
create table group_members(user_id uuid not null, group_id uuid not null references groups on delete cascade, primary key(user_id,group_id));
create table teachers(user_id uuid primary key);
create table aqua_projects(id uuid primary key, group_id uuid not null references groups on delete cascade,
  case_id text not null default 'aquacity', case_name text, title text not null, data jsonb not null, updated_at timestamptz default now());
create table project_progress(project_id uuid references aqua_projects on delete cascade, stage int, done boolean default false, primary key(project_id,stage));
create table water_allocations(project_id uuid references aqua_projects on delete cascade, scenario text, facility text, need int, allocated int, primary key(project_id,scenario,facility));
create table project_revisions(id text primary key, project_id uuid not null references aqua_projects on delete cascade, created_at timestamptz, payload jsonb);
create table project_presentations(project_id uuid primary key references aqua_projects on delete cascade, reflection jsonb, saved_at timestamptz);

create function is_member(g uuid) returns boolean language sql security definer stable
  as $$ select exists(select 1 from group_members where user_id=auth.uid() and group_id=g) or exists(select 1 from teachers where user_id=auth.uid()) $$;

-- Masuk dengan kode kelompok: membuat kelompok baru, atau bergabung bila kode cocok
create function join_group(p_kelas text,p_name text,p_code_hash text,p_members text) returns uuid
language plpgsql security definer as $$
declare g uuid; begin
  select id into g from groups where kelas=p_kelas and name=p_name and code_hash=p_code_hash;
  if g is null then
    if exists(select 1 from groups where kelas=p_kelas and name=p_name) then raise exception 'kode salah'; end if;
    insert into groups(kelas,name,code_hash) values(p_kelas,p_name,p_code_hash) returning id into g;
  end if;
  insert into group_members(user_id,group_id) values(auth.uid(),g) on conflict do nothing;
  return g; end $$;

alter table groups enable row level security; alter table students enable row level security;
alter table group_members enable row level security; alter table teachers enable row level security;
alter table aqua_projects enable row level security; alter table project_progress enable row level security;
alter table water_allocations enable row level security; alter table project_revisions enable row level security;
alter table project_presentations enable row level security;
create policy g_sel on groups for select using (is_member(id));
create policy s_all on students for all using (is_member(group_id)) with check (is_member(group_id));
create policy p_all on aqua_projects for all using (is_member(group_id)) with check (is_member(group_id));
create policy pp_all on project_progress for all using (is_member((select group_id from aqua_projects where id=project_id)));
create policy wa_all on water_allocations for all using (is_member((select group_id from aqua_projects where id=project_id)));
create policy pr_all on project_revisions for all using (is_member((select group_id from aqua_projects where id=project_id)));
create policy pt_all on project_presentations for all using (is_member((select group_id from aqua_projects where id=project_id)));
-- group_members dan teachers tidak punya policy: hanya fungsi security definer yang boleh mengubahnya.`;

const txt=(s,n=10)=>(s||'').trim().length>=n;

function Calc(){
  const [disp,setDisp]=useState('0');const [acc,setAcc]=useState(null);const [op,setOp]=useState(null);const [fresh,setFresh]=useState(true);
  const num=()=>parseFloat(disp.replace(',','.'))||0;
  const out=v=>String(Math.round(v*1e6)/1e6).replace('.',',');
  const apply=(a,o,b)=>o==='+'?a+b:o==='−'?a-b:o==='×'?a*b:b===0?NaN:a/b;
  const press=k=>{
    if(/\d/.test(k)){setDisp(fresh||disp==='0'?k:disp+k);setFresh(false)}
    else if(k===','){if(!disp.includes(',')){setDisp(fresh?'0,':disp+',');setFresh(false)}}
    else if(k==='C'){setDisp('0');setAcc(null);setOp(null);setFresh(true)}
    else if(k==='='){if(op!==null&&acc!==null){const r=apply(acc,op,num());setDisp(isNaN(r)?'Tak bisa ÷ 0':out(r));setAcc(null);setOp(null);setFresh(true)}}
    else{const cur=num();if(op!==null&&acc!==null&&!fresh){const r=apply(acc,op,cur);setAcc(r);setDisp(isNaN(r)?'Tak bisa ÷ 0':out(r))}else setAcc(cur);setOp(k);setFresh(true)}
  };
  const keys=['7','8','9','÷','4','5','6','×','1','2','3','−','0',',','C','+'];
  return html`<div className="calc" role="group" aria-label="Kalkulator"><div className="scr" aria-live="polite">${disp}</div>
    ${keys.map(k=>html`<button key=${k} className=${'ic-k '+('÷×−+'.includes(k)?'op':k==='C'?'clr':'')} onClick=${()=>press(k)} aria-label=${k==='÷'?'bagi':k==='×'?'kali':k==='−'?'kurang':k==='+'?'tambah':k==='C'?'hapus':k==='.'?'koma':k}>${k}</button>`)}
    <button className="eq" style=${{gridColumn:'1/-1'}} onClick=${()=>press('=')}>=</button></div>`;
}

function practiceOf(c){
  const f0=c.fac[0],d=demandOf(c);
  return [
    {k:'add',op:'Penjumlahan',q:`Berapa jumlah kebutuhan air semua fasilitas? (${c.fac.map(f=>fmt(f.need)).join(' + ')})`,a:d},
    {k:'sub',op:'Pengurangan',q:`Persediaan ${fmt(c.supply)} L. Jika ${f0.nama} mengambil ${fmt(f0.need)} L, berapa liter sisanya?`,a:c.supply-f0.need},
    {k:'mul',op:'Perkalian',q:c.mul.q,a:c.mul.a*c.mul.b},
    {k:'div',op:'Pembagian',q:c.div.q,a:c.div.total/c.div.parts}];
}
function Stage2(){

  const reqs=[{ok:PR.every(p=>pOk(p.k)),text:'Jawab keempat latihan hitung dengan benar.'},{ok:ev.overall==='ok',text:'Alokasi memenuhi semua syarat keberhasilan (hijau).'},{ok:txt(pl.notes),text:'Tulis strategi pembagian air.'},{ok:!!pl.savedAt,text:'Simpan rencana.'}];

        <span className="chip">${p.op}</span><p style=${{margin:'8px 0'}}>${p.q}</p>
        <div className="row"><input className="num-in" style=${{width:120}} type="number" inputMode="numeric" aria-label=${'Jawaban '+p.op} value=${x.v} onChange=${e=>setP(p.k,{v:e.target.value,c:false})}/>
          <${Btn} sm kind="yellow" disabled=${x.v===''} onClick=${()=>setP(p.k,{c:true})}>Periksa<//>
          ${x.c&&html`<${Stat} st=${+x.v===p.a?'ok':'bad'}>${+x.v===p.a?'Benar':'Coba hitung lagi'}<//>`}</div></div>`})}</div></div>
      <div className="card"><h3 style=${{marginBottom:10}}>Kalkulator</h3><${Calc}/></div></div>

      <h4 style=${{margin:'14px 0 6px'}}>Pemeriksaan matematis</h4><${SuccessChecks} ev=${ev}/></div>

      ${pl.savedAt&&html`<span className="hint" style=${{marginLeft:10}}>Terakhir disimpan ${tgl(pl.savedAt)}</span>`}</div><//>`;
}

  return html`<${Mission} n=${3} title=${'Design — Rancang '+c.nama} reqs=${reqs} tip="Tempatkan bangunan, seret ke posisi yang kamu suka, lalu hubungkan dengan pipa. Air hanya sampai ke bangunan yang tersambung ke tangki.">

          <span style=${{display:'flex',alignItems:'center',gap:8}}><svg width="38" height="38" viewBox="-44 -50 88 90" aria-hidden="true"><${Glyph} id=${glyphOf(c,id)}/></svg>${nameOf(c,id)}</span>

          <div className="row" style=${{marginTop:12}}><${Btn} kind="mint" icon="save" onClick=${()=>{patch(x=>{x.design.savedAt=nowIso()});toast('Desain disimpan di perangkat ini.')}}>Simpan<//>
          ${rs?html`<${Btn} kind="coral" icon="rotate" onClick=${()=>{patch(x=>{x.design={pos:defPos(caseOf(x)),placed:{tank:true},edges:[],savedAt:null}});setRs(false);toast('Desain dikembalikan ke awal.')}}>Ya, reset<//><${Btn} sm onClick=${()=>setRs(false)}>Batal<//>`:html`<${Btn} icon="rotate" onClick=${()=>setRs(true)}>Reset<//>`}</div>
          ${d.savedAt&&html`<p className="hint" style=${{marginTop:8}}>Disimpan ${tgl(d.savedAt)}</p>`}</div></div></div>

function Stage6(){

function Slides({onClose}){
  const {proj}=useCtx();const p=proj,c=caseOf(p),SC=scenOf(c);const [i,setI]=useState(0);
  const en=evaluate(p,'normal',true),lastRun=sc=>p.sim.history.filter(h=>h.scen===sc).slice(-1)[0];
  const rev=p.improve.revisions.slice(-1)[0],r=p.present.reflection;
  const S=[
    ['Aqua Engineer Math',html`<div><h3 className="big-t">${p.title} · Misi ${c.nama}</h3><p>Kelompok ${p.group.name} · Kelas ${p.group.kelas}</p><p>Anggota: ${p.group.members||'-'}</p><${Aqua} size=${120}/></div>`],
    ['Masalah di '+c.nama,html`<div><p>${p.explore.q1||'-'}</p><p style=${{marginTop:10}}>Persediaan <b>${fmt(c.supply)} L</b>, kebutuhan <b>${fmt(demandOf(c))} L</b>.</p></div>`],
    ['Perhitungan kami',html`<ul className="list">${en.rows.map(x=>html`<li key=${x.id}>${x.nama}: ${fmt(x.need)} L butuh, ${fmt(x.alloc)} L dialokasikan</li>`)}<li><b>Total ${fmt(en.total)} L dari ${fmt(en.S.supply)} L, sisa ${fmt(en.left)} L</b></li></ul>`],
    ['Desain '+c.nama,html`<${DesignCanvas} editable=${false} scen="normal" flow=${true}/>`],
    ['Strategi dan rute',html`<div><p>${p.plan.notes||'-'}</p><ul className="list" style=${{marginTop:10}}>${p.design.edges.map(k=>html`<li key=${k}>${k.split('|').map(x=>nameOf(c,x)).join(' ↔ ')}</li>`)}</ul></div>`],
    ['Hasil simulasi',html`<ul className="list">${['normal','kurang'].map(k=>{const h=lastRun(k);return html`<li key=${k}>${SC[k].nama}: ${h?html`<${Stat} st=${h.overall}/> total ${fmt(h.total)} dari ${fmt(h.supply)} L`:'belum dijalankan'}</li>`})}</ul>`],
    ['Artefak Aqua City Smart Board',html`<p>${p.create.checks.filter(Boolean).length} dari 6 langkah pembuatan selesai.</p>`],
    ['Perbaikan yang dilakukan',html`<div>${rev?html`<div><p><b>Masalah:</b> ${rev.fields.masalah}</p><p><b>Perubahan:</b> ${rev.fields.perubahan}</p><p><b>Hasil:</b> ${rev.fields.hasil}</p></div>`:html`<p>Belum ada revisi.</p>`}</div>`],
    ['Kesimpulan kami',html`<div><p><b>Yang kami pelajari:</b> ${r.r1||'-'}</p><p><b>Peran matematika:</b> ${r.r2||'-'}</p></div>`]];
  useEffect(()=>{const f=e=>{if(e.key==='ArrowRight')setI(x=>Math.min(S.length-1,x+1));if(e.key==='ArrowLeft')setI(x=>Math.max(0,x-1));if(e.key==='Escape')onClose()};window.addEventListener('keydown',f);return()=>window.removeEventListener('keydown',f)},[]);
  return html`<div className="present" role="dialog" aria-modal="true" aria-label="Mode presentasi"><div className="slide"><h2>${S[i][0]}</h2>${S[i][1]}</div>
    <div className="row" style=${{justifyContent:'space-between'}}><${Btn} icon="left" disabled=${i===0} onClick=${()=>setI(i-1)}>Kembali<//><b>${i+1} / ${S.length}</b>

function mockAlloc(c,supply){
  const dem=demandOf(c),o={};
  if(supply>=dem){c.fac.forEach(f=>{o[f.id]=f.need});return o}
  const mins=c.fac.map(f=>pc(f.need,f.min)),rest=Math.max(0,supply-mins.reduce((a,b)=>a+b,0)),gap=c.fac.map((f,i)=>f.need-mins[i]),gs=gap.reduce((a,b)=>a+b,0)||1;
  let used=0;c.fac.forEach((f,i)=>{o[f.id]=mins[i]+Math.floor(rest*gap[i]/gs/5)*5;used+=o[f.id]});
  let left=supply-used;
  c.fac.forEach(f=>{const add=Math.min(left,f.need-o[f.id]);if(add>0){o[f.id]+=add;left-=add}});
  return o;
}

/* ---- Akses kelompok ---- */
function AccessModal({onClose,pending}){
  const {data,setData,setSession,unlock,toast,go,startMission}=useCtx();const [tab,setTab]=useState('masuk');const [err,setErr]=useState('');const [busy,setBusy]=useState(false);
  const [f,setF]=useState({kelas:'',name:'',members:'',code:''});const u=(k,v)=>setF(x=>({...x,[k]:v}));
  const submit=async e=>{
    e.preventDefault();setErr('');setBusy(true);const h=await sha(f.code.trim());const name=f.name.trim(),kelas=f.kelas.trim().toUpperCase();
    const named=data.projects.filter(p=>p.group.name.toLowerCase()===name.toLowerCase()&&p.group.kelas===kelas);
    if(tab==='masuk'){
      const mine=named.filter(p=>p.group.codeHash===h);
      if(!mine.length){setErr(named.length?'Kode kelompok belum cocok.':'Kelompok itu belum terdaftar di perangkat ini. Pilih "Kelompok baru".');setBusy(false);return}
      const g=mine[0].group,sess={kelas,name:g.name,members:g.members,codeHash:h};
      setSession(sess);mine.forEach(p=>unlock(p.id));toast('Selamat datang kembali, '+g.name+'!');onClose();
      if(pending)startMission(pending,sess);
      else{const last=mine.slice().sort((a,b)=>b.updated>a.updated?1:-1)[0];setData(d=>({...d,currentId:last.id}));go('dashboard')}
    }else{
      if(named.length){setErr('Nama kelompok itu sudah dipakai di kelas '+kelas+'. Pilih nama lain, atau masuk dengan kodenya.');setBusy(false);return}
      const sess={kelas,name,members:f.members.trim(),codeHash:h};setSession(sess);onClose();
      if(pending)startMission(pending,sess);else{toast('Kelompok dibuat. Pilih misimu!');go('misi')}
    }
    setBusy(false);
  };
  const ok=f.kelas.trim()&&f.name.trim()&&f.code.trim().length>=4&&(tab==='masuk'||f.members.trim());
  return html`<${Modal} title="Masuk dengan Kode Kelompok" onClose=${onClose}>
    ${pending&&html`<p style=${{marginBottom:10}}>Misi yang kamu pilih: <b>${caseById(pending).nama}</b></p>`}
    <div className="seg" style=${{marginBottom:14}} role="group" aria-label="Pilih cara masuk"><button aria-pressed=${tab==='masuk'} onClick=${()=>setTab('masuk')}>Sudah punya kelompok</button><button aria-pressed=${tab==='baru'} onClick=${()=>setTab('baru')}>Kelompok baru</button></div>
    <form onSubmit=${submit}>
      <${Field} id="a-kelas" label="Kelas" hint="Contoh: 5A"><input id="a-kelas" className="in" value=${f.kelas} onChange=${e=>u('kelas',e.target.value)} autoComplete="off"/><//>
      <${Field} id="a-name" label="Nama kelompok" hint="Contoh: AQUA-01"><input id="a-name" className="in" value=${f.name} onChange=${e=>u('name',e.target.value)} autoComplete="off"/><//>
      ${tab==='baru'&&html`<${Field} id="a-mem" label="Anggota kelompok" hint="Tulis nama-nama, pisahkan dengan koma."><input id="a-mem" className="in" value=${f.members} onChange=${e=>u('members',e.target.value)}/><//>`}
      <${Field} id="a-code" label=${tab==='baru'?'Buat kode kelompok (min. 4 karakter)':'Kode kelompok'}><input id="a-code" className="in" type="password" value=${f.code} onChange=${e=>u('code',e.target.value)} autoComplete="off"/><//>
      ${err&&html`<${AquaTip} mood="sad" tone="bad">${err}<//>`}
      <div className="row" style=${{marginTop:14}}><${Btn} kind="orange" type="submit" disabled=${!ok||busy}>${tab==='masuk'?'Masuk':'Buat kelompok'}<//></div>
      <p className="hint" style=${{marginTop:10}}>Tanpa email. Kode disimpan dalam bentuk hash di perangkat ini. Ingat kodenya karena tidak bisa dilihat lagi.</p></form><//>`;
}

      <p className="hint">Tahap saat ini: ${STAGES[curStage(p)-1].k}${p.stageDone[7]?' (semua selesai)':''}</p><p className="hint">Dibuat ${tgl(p.created)}</p><p className="hint">Terakhir disimpan ${tgl(p.updated)}</p>

      <div className="row"><${Btn} sm icon="copy" onClick=${()=>copy(detail)}>Salin data<//>${del===detail.id?html`<${Btn} sm kind="coral" icon="trash" onClick=${()=>{setData(d=>({...d,projects:d.projects.filter(x=>x.id!==detail.id),currentId:d.currentId===detail.id?null:d.currentId}));setSel(null);setDel(null);toast('Proyek dihapus dari perangkat ini.')}}>Ya, hapus<//><${Btn} sm onClick=${()=>setDel(null)}>Batal<//>`:html`<${Btn} sm icon="trash" onClick=${()=>setDel(detail.id)}>Hapus<//>`}</div></div><${ProjDetail} p=${detail}/></div>`}</div>`;

/* ---- Tentang + Supabase ---- */
function keyRole(k){try{return JSON.parse(atob(k.split('.')[1].replace(/-/g,'+').replace(/_/g,'/'))).role}catch(e){return null}}
/* UI teknis Supabase disembunyikan sementara. Kode dan fungsi SB tetap ada; ubah ke true untuk menampilkannya lagi. */
const SHOW_SB=false;
function Tentang(){
  const {data,setData,proj,toast,saveInfo}=useCtx();const sb=data.settings.sb;const [u,setU]=useState(sb.url);const [k,setK]=useState(sb.key);const [tc,setTc]=useState(data.settings.teacherCode);
  const [msg,setMsg]=useState(null);const [busy,setBusy]=useState(false);
  const saveCfg=()=>{if(keyRole(k.trim())==='service_role'){setMsg({t:'bad',s:'Kunci itu adalah service_role. Jangan pernah dipakai di aplikasi. Gunakan anon key.'});return}
    setData(d=>({...d,settings:{...d.settings,sb:{url:u.trim(),key:k.trim()}}}));SB._t=null;setMsg({t:'ok',s:'Pengaturan disimpan di perangkat ini.'})};
  const run=async fn=>{setBusy(true);setMsg(null);try{await fn();}catch(e){setMsg({t:'bad',s:'Gagal: '+(e&&e.message?e.message:e)+'. Jika halaman ini dibuka dari tautan artifact, peramban memblokir koneksi ke server lain; pasang aplikasi di hosting sendiri.'})}setBusy(false)};
  const cfg=data.settings.sb,ready=SB.ready(cfg);
  const copySql=async()=>{try{await navigator.clipboard.writeText(SQL);toast('Skema SQL disalin.')}catch(e){toast('Penyalinan ditolak. Pilih teks lalu salin manual.',true)}};
  return html`<div className="main"><h1>Tentang Aplikasi</h1>
    <div className="card"><div className="row"><${Aqua} size=${70}/><div className="grow"><h3>Aqua Engineer Math</h3><p>Hitung • Rancang • Bangun • Selamatkan Kota!</p></div></div>
      <p style=${{marginTop:10}}>Lingkungan belajar numerasi digital untuk siswa kelas 5 SD. Aplikasi ini adalah ruang berpikir dan merancang. Artefak fisik dibuat sendiri oleh siswa. Semua angka adalah data fiktif untuk belajar.</p></div>
    <div className="card"><h3 style=${{marginBottom:8}}>Penyimpanan Data</h3>
      <div className=${'banner '+(saveInfo.ok?'warn':'bad')}><${Icon} n=${saveInfo.ok?'info':'alert'} size=${24} sw=${3}/><span>${saveInfo.ok?'Pekerjaan kelompokmu tersimpan otomatis di perangkat ini. Jika aplikasi dibuka di perangkat lain, pekerjaan itu belum ikut terbawa.':'Perangkat ini tidak mengizinkan penyimpanan, jadi pekerjaan akan hilang saat halaman ditutup.'}</span></div>
      ${SHOW_SB&&html`<div>
      <p className="hint" style=${{margin:'10px 0'}}>Status Supabase: ${ready?'terkonfigurasi (belum tentu tersambung, ujilah di bawah).':'belum dikonfigurasi. Aplikasi memakai penyimpanan lokal.'} Hanya anon key publik yang dipakai. Jangan pernah memasukkan service_role key.</p>
      <${Field} id="sb-url" label="Project URL Supabase"><input id="sb-url" className="in" placeholder="https://xxxx.supabase.co" value=${u} onChange=${e=>setU(e.target.value)}/><//>
      <${Field} id="sb-key" label="Anon key (publik)"><input id="sb-key" className="in" type="password" value=${k} onChange=${e=>setK(e.target.value)}/><//>
      <div className="row"><${Btn} kind="mint" icon="save" onClick=${saveCfg}>Simpan pengaturan<//>

/* ===== Kerangka aplikasi, rute, dan penyimpanan ===== */
const PAGES=NAV.map(n=>n[0]);
function parseHash(){
  const h=(location.hash||'').replace('#','');const m=h.match(/^([a-z]+)(?:-(\d))?$/);
  if(!m||!PAGES.includes(m[1]))return {page:'beranda',stage:null};
  return {page:m[1],stage:m[2]?Math.min(7,Math.max(1,+m[2])):null};
}
function App(){
  const [data,setData]=useState(()=>({...loadAll(),currentId:null}));
  const [route,setRoute]=useState(parseHash);
  const [toastM,setToastM]=useState(null);const [access,setAccess]=useState(false);const [mat,setMat]=useState(null);
  const [unlocked,setUnlocked]=useState([]);const [session,setSession]=useState(null);const [pending,setPending]=useState(null);const [saveInfo,setSaveInfo]=useState({ok:true,at:null});
  const tRef=useRef(null);
  const proj=data.projects.find(p=>p.id===data.currentId)||null;

  useEffect(()=>{
    try{const {currentId,...rest}=data;localStorage.setItem(LS,JSON.stringify(rest));setSaveInfo({ok:true,at:nowIso()})}catch(e){setSaveInfo({ok:false,at:null})}
  },[data]);
  useEffect(()=>{const f=()=>setRoute(parseHash());window.addEventListener('hashchange',f);return()=>window.removeEventListener('hashchange',f)},[]);

  const toast=useCallback((msg,err)=>{setToastM({msg,err});clearTimeout(tRef.current);tRef.current=setTimeout(()=>setToastM(null),3800)},[]);
  const patch=useCallback(fn=>setData(d=>({...d,projects:d.projects.map(p=>{if(p.id!==d.currentId)return p;const c=clone(p);fn(c);c.updated=nowIso();return c})})),[]);
  const unlock=useCallback(id=>setUnlocked(u=>u.includes(id)?u:[...u,id]),[]);
  const goRaw=(page,stage)=>{const h='#'+page+(stage?'-'+stage:'');if(location.hash!==h){try{location.hash=h}catch(e){}}setRoute({page,stage:stage||null});try{window.scrollTo({top:0})}catch(e){}};
  const go=useCallback((page,stage,force)=>{
    if(page==='petualangan'&&!proj&&!force){toast('Pilih misi dulu ya, lalu masuk dengan kode kelompok.',true);goRaw('misi');return}
    if(page==='petualangan'&&stage&&proj&&!force&&stageState(proj,stage)==='locked'){toast('Selesaikan tahap '+STAGES[curStage(proj)-1].k+' dulu untuk membuka tahap ini.',true);return}
    goRaw(page,stage);
  },[proj,toast]);

  /* Memilih misi: tidak pernah menimpa proyek lama. Jika kelompok sudah punya proyek untuk misi itu, dilanjutkan; proyek baru hanya dibuat atas permintaan. */
  const startMission=(caseId,sess,forceNew)=>{
    sess=sess||session;
    if(!sess){setPending(caseId);setAccess(true);return}
    const c=caseById(caseId),same=data.projects.filter(p=>p.caseId===caseId&&sameGroup(p.group,sess)),ex=!forceNew&&same.slice().sort((a,b)=>b.updated>a.updated?1:-1)[0];
    if(ex){setData(d=>({...d,currentId:ex.id}));unlock(ex.id);toast('Melanjutkan proyek misi '+c.nama+'.');goRaw('petualangan',curStage(ex));return}
    const np=newProject({caseId,title:c.nama+(same.length?' ('+(same.length+1)+')':''),group:sess});
    setData(d=>({...d,projects:[...d.projects,np],currentId:np.id}));unlock(np.id);toast('Misi '+c.nama+' dimulai. Selamat berpetualang!');goRaw('petualangan',1);
  };
  const ctx={data,setData,proj,patch,go,toast,unlocked,unlock,saveInfo,session,setSession,startMission,openAccess:()=>{setPending(null);setAccess(true)},openMat:k=>setMat(k)};
  const Page=route.page;
  return html`<${Ctx.Provider} value=${ctx}><div className="shell">
    <aside className="side" aria-label="Navigasi utama"><div className="brand"><${Logo} width=${176}/></div>
      <nav>${NAV.map(n=>html`<button key=${n[0]} className="nav" aria-current=${route.page===n[0]?'page':undefined} onClick=${()=>go(n[0],null,n[0]==='petualangan')}><${Icon} n=${n[3]} size=${24}/>${n[1]}</button>`)}</nav>
      <div className="side-foot"><div className="pill-save">${saveInfo.ok?'Tersimpan di perangkat ini (lokal). Belum tersinkron ke server.':'Penyimpanan lokal ditolak peramban.'}</div></div></aside>
    <main className="main" id="konten">
      <div className="topbar"><div className="row"><div className="chip"><${Icon} n="users" size=${16}/>${session?`${session.name} · Kelas ${session.kelas}`:'Belum masuk kelompok'}</div>${proj&&html`<div className="chip" style=${{background:'#E8FAFF'}}>Misi: ${proj.caseName}</div>`}</div>
        <div className="row"><${Btn} sm icon="flag" onClick=${()=>go('misi')}>Pilih misi<//><${Btn} sm icon=${session?'folder':'lock'} onClick=${()=>session?go('proyek'):ctx.openAccess()}>${session?'Proyek saya':'Masuk dengan kode'}<//></div></div>
      ${Page==='beranda'&&html`<${Beranda}/>`}${Page==='dashboard'&&html`<${Dashboard}/>`}${Page==='tujuan'&&html`<${Tujuan}/>`}${Page==='materi'&&html`<${Materi}/>`}
      ${Page==='misi'&&html`<${Misi}/>`}${Page==='petualangan'&&html`<${Petualangan} stage=${route.stage}/>`}${Page==='proyek'&&html`<${Proyek}/>`}
      ${Page==='prestasi'&&html`<${Prestasi}/>`}${Page==='guru'&&html`<${Guru}/>`}${Page==='tentang'&&html`<${Tentang}/>`}</main>
    <nav className="bottom" aria-label="Navigasi utama (ponsel)">${NAV.map(n=>html`<button key=${n[0]} className="nav" aria-current=${route.page===n[0]?'page':undefined} onClick=${()=>go(n[0],null,n[0]==='petualangan')}><${Icon} n=${n[3]} size=${22}/>${n[2]}</button>`)}</nav>
    ${access&&html`<${AccessModal} pending=${pending} onClose=${()=>{setAccess(false);setPending(null)}}/>`}
    ${mat&&html`<${MatModal} k=${mat} onClose=${()=>setMat(null)}/>`}
    ${toastM&&html`<div className=${'toast'+(toastM.err?' err':'')} role="status">${toastM.msg}</div>`}
  </div><//>`;
}
ReactDOM.createRoot(document.getElementById('root')).render(html`<${App}/>`);
